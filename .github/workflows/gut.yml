name: godot-gut-tests

on:
  push:
  pull_request:

jobs:
  run-gut:
    name: Run GUT tests (Godot 4.5.1)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      # 1) Warm-up import so class_name scripts are registered (since .godot/ isn't committed)
      - name: Import project (headless)
        run: |
          godot --headless --path . --import --quit

      # 2) Run GUT headless
      - name: Run GUT
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"   # hides RID/ObjectDB leak spam so exit code reflects tests
        run: |
          godot --headless -d \
                --display-driver headless \
                --audio-driver Dummy \
                --disable-render-loop \
                --path . \
                -s res://addons/gut/gut_cmdln.gd \
                -gdir=res://tests \
                -ginclude_subdirs \
                -gexit

